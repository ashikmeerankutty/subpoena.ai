[project]
name = "subpoena-schemas"
version = "0.1.0"
description = "Shared payload, agent-output and storage schemas for Subpoena.ai"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subpoena_schemas"]
