[project]
name = "subpoena-store"
version = "0.1.0"
description = "Persistence for Subpoena.ai: in-memory and Firestore implementations of one Store protocol"
requires-python = ">=3.12"
dependencies = ["subpoena-schemas", "google-cloud-firestore>=2.18"]

[tool.uv.sources]
subpoena-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subpoena_store"]
