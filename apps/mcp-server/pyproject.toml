[project]
name = "subpoena-mcp"
version = "0.1.0"
description = "Subpoena.ai MCP server: read-only resources and per-agent allow-listed tools"
requires-python = ">=3.12"
dependencies = [
    "subpoena-schemas",
    "subpoena-store",
    "mcp>=2.3",
    "google-cloud-bigquery>=3.25",
    "google-cloud-firestore>=2.18",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[tool.uv.sources]
subpoena-schemas = { workspace = true }
subpoena-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subpoena_mcp"]
