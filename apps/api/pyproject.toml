[project]
name = "subpoena-api"
version = "0.1.0"
description = "Subpoena.ai REST API: validation, Tier 0 pre-screen, evaluation lifecycle"
requires-python = ">=3.12"
dependencies = [
    "subpoena-schemas",
    "subpoena-store",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "google-cloud-pubsub>=2.23",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
subpoena-schemas = { workspace = true }
subpoena-store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subpoena_api"]
