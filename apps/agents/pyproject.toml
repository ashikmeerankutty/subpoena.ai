[project]
name = "subpoena-agents"
version = "0.1.0"
description = "Subpoena.ai courtroom: ADK agents, debate protocol, decision policy"
requires-python = ">=3.12"
dependencies = [
    "subpoena-schemas",
    "subpoena-mcp",
    "google-adk>=2.11",
    "google-genai>=2.29",
    "mcp>=2.3",
    "google-cloud-firestore>=2.18",
    "google-cloud-tasks>=2.16",
    "subpoena-store",
    "subpoena-api",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[tool.uv.sources]
subpoena-schemas = { workspace = true }
subpoena-mcp = { workspace = true }
subpoena-store = { workspace = true }
subpoena-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subpoena_agents"]
